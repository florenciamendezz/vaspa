name: VASPA CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting y Validación Estática de PHP y Composer
  # ----------------------------------------------------------------------------
  php-lint-and-composer:
    name: Linting de Sintaxis PHP y Validación Composer
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar runtime de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring, fileinfo, gd, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Verificar sintaxis de todo el código PHP (Linting)
        run: php scripts/lint.php

  # ----------------------------------------------------------------------------
  # Job 2: Auditoría y Verificación de Seguridad del Repositorio
  # ----------------------------------------------------------------------------
  security-audit:
    name: Verificación de Secretos y Reglas Perimetrales
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar que no existan archivos de secretos versionados (.env)
        run: |
          if [ -f ".env" ]; then
            echo "ERROR DE SEGURIDAD: Se encontró un archivo .env versionado en el repositorio."
            exit 1
          fi
          echo "OK: Archivo .env correctamente excluido de control de versiones."

      - name: Verificar presencia y completitud de .env.example
        run: |
          test -f ".env.example" || (echo "ERROR: Falta plantilla .env.example" && exit 1)
          grep -q "APP_ENV" .env.example || (echo "ERROR: .env.example incompleto" && exit 1)
          echo "OK: Plantilla .env.example válida."

      - name: Verificar presencia de reglas de protección perimetral (.htaccess)
        run: |
          test -f ".htaccess" || (echo "ERROR: Falta .htaccess raíz" && exit 1)
          test -f "scriptBD/.htaccess" || (echo "ERROR: Falta .htaccess en scriptBD" && exit 1)
          test -f "cron/.htaccess" || (echo "ERROR: Falta .htaccess en cron" && exit 1)
          test -f "archivos/.htaccess" || (echo "ERROR: Falta .htaccess en archivos" && exit 1)
          test -f "programas/.htaccess" || (echo "ERROR: Falta .htaccess en programas" && exit 1)
          echo "OK: Todos los archivos perimetrales .htaccess de seguridad están presentes."

  # ----------------------------------------------------------------------------
  # Job 3: Construcción y Verificación de Imagen Docker
  # ----------------------------------------------------------------------------
  docker-build:
    name: Construcción y Verificación de Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de producción/desarrollo
        run: |
          docker build -t uarg-unpa/vaspa:ci .
          echo "OK: Imagen Docker construida satisfactoriamente."

  # ----------------------------------------------------------------------------
  # Job 4: Ejecución Automatizada de Pruebas E2E (Playwright)
  # ----------------------------------------------------------------------------
  e2e-playwright-tests:
    name: Pruebas Funcionales y de Seguridad E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: bdgef_vaspa
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar runtime de PHP 8.2 y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring, fileinfo, gd, zip
          ini-values: display_errors=On, error_reporting=E_ALL
          coverage: none

      - name: Inicializar bases de datos en MariaDB
        run: |
          mysql -h 127.0.0.1 -u root -proot_ci_password < scriptBD/01_bdusuarios.sql
          mysql -h 127.0.0.1 -u root -proot_ci_password < "scriptBD/02_ESTRUCTURA - bdgef_vaspa.sql"
          mysql -h 127.0.0.1 -u root -proot_ci_password < "scriptBD/03_DATOS - bdgef_vaspa.sql"
          mysql -h 127.0.0.1 -u root -proot_ci_password < scriptBD/04_migracion_circuito_vaspa.sql

      - name: Generar archivo .env para el entorno de integración continua
        run: |
          cat << 'EOF' > .env
          APP_ENV=local
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000/
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASS=root_ci_password
          DB_NAME=bdgef_vaspa
          DB_CHARSET=utf8
          MAIL_DRIVER=smtp
          MAIL_HOST=localhost
          MAIL_PORT=1025
          FORZAR_ENVIO_MAIL=false
          EOF

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Instalar dependencias de pruebas Playwright
        run: |
          cd tests/e2e
          npm install

      - name: Instalar navegadores de Playwright con dependencias de sistema
        run: |
          cd tests/e2e
          npx playwright install --with-deps chromium

      - name: Iniciar servidor web PHP en segundo plano
        run: |
          php -S 127.0.0.1:8000 -t . &
          sleep 3
          curl -I http://127.0.0.1:8000/ || exit 1

      - name: Ejecutar Suite E2E de Playwright
        run: |
          cd tests/e2e
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000/

      - name: Publicar reporte y artefactos de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
